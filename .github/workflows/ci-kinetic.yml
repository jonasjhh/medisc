name: CI (Kinetic)

on:
  push:
    branches: ["**"]
    paths:
      - "kinetic/**"
      - ".github/workflows/ci-kinetic.yml"
  pull_request:
    paths:
      - "kinetic/**"

concurrency:
  group: ci-kinetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: kinetic/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kinetic/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: kinetic
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: kinetic
        run: pnpm lint

      - name: Format check
        working-directory: kinetic
        run: pnpm format:check

      - name: Typecheck
        working-directory: kinetic
        run: pnpm typecheck

      - name: Build
        working-directory: kinetic
        run: pnpm build
