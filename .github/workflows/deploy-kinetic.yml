name: Deploy Kinetic (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - "kinetic/**"
      - ".github/workflows/deploy-kinetic.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-kinetic
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: kinetic/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kinetic/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: kinetic
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: kinetic
        run: pnpm build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: kinetic
          command: deploy
